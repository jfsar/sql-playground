[package]
name = "query-analyzer"
version = "0.1.0"
edition = "2024"
description = "SQLite query plan parser and plan diff (PoC-gated, ADR-002)"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
wasm-bindgen = "=0.2.130"

[dev-dependencies]
serde_json = "1"
