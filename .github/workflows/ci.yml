name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: jetli/wasm-bindgen-action@v0.2.0
        with:
          version: v0.2.130

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Rust tests (plan parser + diff)
        run: cargo test

      - name: Build query-analyzer wasm (ADR-002 gate)
        run: pnpm build:wasm

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests (includes wasm round-trip)
        run: pnpm test

      - name: Build (catches Vite/WASM packaging issues)
        run: pnpm --filter web build

  e2e:
    name: Playwright e2e (production build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: jetli/wasm-bindgen-action@v0.2.0
        with:
          version: v0.2.130

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build query-analyzer wasm (ADR-002 gate)
        run: pnpm build:wasm

      - name: Install Playwright browsers
        run: pnpm --filter web exec playwright install --with-deps chromium

      # E2E_PREVIEW runs the suite against `vite preview` (production bundle):
      # the ADR-002 gate requires the wasm to load in a production Vite build.
      - name: Run e2e (production preview)
        run: pnpm test:e2e
        env:
          E2E_PREVIEW: "1"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
