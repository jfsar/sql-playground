name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: jetli/wasm-bindgen-action@v0.2.0
        with:
          version: 0.2.130

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Rust tests (plan parser + diff)
        run: cargo test

      - name: Build query-analyzer wasm (ADR-002 gate)
        run: pnpm build:wasm

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests (includes wasm round-trip)
        run: pnpm test

      - name: Build (catches Vite/WASM packaging issues)
        run: pnpm --filter web build

  e2e:
    name: Playwright e2e (${{ matrix.browser }}, production build)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Chromium and Firefox gate CI. WebKit is a Safari proxy and best
        # effort: it runs here but a failure does not block the workflow.
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: jetli/wasm-bindgen-action@v0.2.0
        with:
          version: 0.2.130

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build query-analyzer wasm (ADR-002 gate)
        run: pnpm build:wasm

      - name: Install Playwright browser
        run: pnpm --filter web exec playwright install --with-deps ${{ matrix.browser }}
        continue-on-error: ${{ matrix.browser == 'webkit' }}

      # E2E_PREVIEW runs the suite against `vite preview` (production bundle):
      # the ADR-002 gate requires the wasm to load in a production Vite build.
      - name: Run e2e (production preview)
        id: e2e
        run: pnpm test:e2e
        continue-on-error: ${{ matrix.browser == 'webkit' }}
        env:
          E2E_PREVIEW: "1"
          E2E_BROWSER: ${{ matrix.browser }}

      # `continue-on-error` keeps the job green for WebKit, so also check the
      # step outcome to capture its report instead of losing it.
      - uses: actions/upload-artifact@v4
        if: failure() || steps.e2e.outcome == 'failure'
        with:
          name: playwright-report-${{ matrix.browser }}
          path: apps/web/playwright-report/
          retention-days: 7
